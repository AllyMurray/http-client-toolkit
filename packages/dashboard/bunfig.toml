# Bun loads test settings from the package working directory.
[test]
# The coverage script enforces 100% per file after applying existing V8 exclusions.
coverageThreshold = 0.0
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coveragePathIgnorePatterns = ["src/index.ts", "**/src/types/**", "**/src/stores/cache-store.ts", "**/src/stores/dedupe-store.ts", "**/src/client/**", "**/lib/**", "**/dist/**"]
