name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up pinned Bun
        run: npm install --global "bun@$(cat "$GITHUB_WORKSPACE/.bun-version")"

      - name: Reject major version changesets
        if: vars.ALLOW_MAJOR_VERSION != 'true'
        run: |
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = "README.md" ] && continue
            if grep -qE "^[[:space:]]*['\"].+['\"]:[[:space:]]*major[[:space:]]*$" "$file"; then
              echo "::error::Major changeset found in $file. Major version bumps are blocked. Set the ALLOW_MAJOR_VERSION repo variable to 'true' to allow."
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit:dependencies

      - name: Test dependency policy
        run: |
          bun run test:dependency-policy
          node --test build-tests/audit-dependencies.test.mjs build-tests/coverage.test.mjs

      - name: Build packages
        run: bun run build

      - name: Lint
        run: bun run lint:check

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Rehearse major release without publishing
        run: bun run test:release

      - name: Tests and coverage
        run: bun run test:coverage

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7
      - name: Setup build runtime
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up pinned Bun
        run: npm install --global "bun@$(cat "$GITHUB_WORKSPACE/.bun-version")"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:package:prepare
      - name: Setup consumer runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test installed packages on consumer runtime
        run: node build-tests/installed-package.mjs

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up pinned Bun
        run: npm install --global "bun@$(cat "$GITHUB_WORKSPACE/.bun-version")"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build documentation
        run: bun run build

      - name: Audit documentation dependencies
        run: bun audit
