name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the currently versioned packages on the selected ref without requiring changesets
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          AUTHOR_NAME=$(git log -1 --pretty=format:'%an')
          AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          echo "Setting git config to: $AUTHOR_NAME <$AUTHOR_EMAIL>"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Tests
        run: pnpm test

      - name: Reject major version changesets
        if: vars.ALLOW_MAJOR_VERSION != 'true'
        run: |
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = "README.md" ] && continue
            if grep -qE '^\s*".+":\s*major\s*$' "$file"; then
              echo "::error::Major changeset found in $file. Major version bumps are blocked. Set the ALLOW_MAJOR_VERSION repo variable to 'true' to allow."
              exit 1
            fi
          done

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          echo "count=$CHANGESET_COUNT"
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets found, skipping publish"
          fi

      - name: Decide release mode
        id: release_mode
        run: |
          HAS_CHANGESETS="${{ steps.changesets.outputs.has_changesets }}"
          PUBLISH_EXISTING="${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing }}"

          if [ "$HAS_CHANGESETS" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_version=true" >> "$GITHUB_OUTPUT"
            echo "mode=version-and-publish" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_EXISTING" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_version=false" >> "$GITHUB_OUTPUT"
            echo "mode=publish-existing" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_version=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

          echo "Release mode: $(cat "$GITHUB_OUTPUT" | tail -n 1)"

      - name: Version packages
        if: steps.release_mode.outputs.should_version == 'true'
        run: |
          npx changeset version
          git add .
          git commit -m "chore: release packages"

      - name: Setup npm for trusted publishing
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          pnpm add -g npm@11.6.2
          node --version
          npm --version

      - name: Publish packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: npx changeset publish --access public
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true

      - name: Push release commit
        if: steps.release_mode.outputs.should_version == 'true'
        run: git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tags
        if: steps.release_mode.outputs.should_publish == 'true'
        run: git push origin --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          for TAG in $(git tag --points-at HEAD); do
            echo "Creating release for $TAG"
            gh release create "$TAG" --title "$TAG" --generate-notes
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
