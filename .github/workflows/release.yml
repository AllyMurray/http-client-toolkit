name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the currently versioned packages on the selected ref without requiring changesets
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CI: 'true'
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit workspace and documentation dependencies
        run: |
          pnpm audit:dependencies
          pnpm --dir docs-site audit

      - name: Build packages
        run: pnpm run build

      - name: Tests
        run: pnpm test

      - name: Reject major version changesets
        if: vars.ALLOW_MAJOR_VERSION != 'true'
        run: |
          for file in .changeset/*.md; do
            [ "$(basename "$file")" = "README.md" ] && continue
            if grep -qE "^[[:space:]]*['\"].+['\"]:[[:space:]]*major[[:space:]]*$" "$file"; then
              echo "::error::Major changeset found in $file. Major version bumps are blocked. Set the ALLOW_MAJOR_VERSION repo variable to 'true' to allow."
              exit 1
            fi
          done

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESET_COUNT=$(node --input-type=module -e "import { readdirSync } from 'node:fs'; console.log(readdirSync('.changeset').filter(name => name.endsWith('.md') && name !== 'README.md').length)")
          echo "count=$CHANGESET_COUNT"
          if [ "$CHANGESET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets found, skipping publish"
          fi

      - name: Validate recovery ref
        if: github.event_name == 'workflow_dispatch' && inputs.publish_existing
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::publish_existing is only allowed from main"
            exit 1
          fi

      - name: Decide release mode
        id: release_mode
        run: |
          HAS_CHANGESETS="${{ steps.changesets.outputs.has_changesets }}"
          PUBLISH_EXISTING="${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing }}"

          if [ "$HAS_CHANGESETS" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_version=true" >> "$GITHUB_OUTPUT"
            echo "mode=version-and-publish" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLISH_EXISTING" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_version=false" >> "$GITHUB_OUTPUT"
            echo "mode=publish-existing" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_version=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

          echo "Release mode: $(cat "$GITHUB_OUTPUT" | tail -n 1)"

      - name: Version packages
        if: steps.release_mode.outputs.should_version == 'true'
        run: |
          pnpm exec changeset version
          pnpm install --lockfile-only --ignore-scripts

      - name: Validate versioned packages before publishing
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run typecheck
          pnpm run lint:check
          pnpm run test:package:prepare
          pnpm run test:package

      - name: Commit release metadata
        if: steps.release_mode.outputs.should_version == 'true'
        run: |
          git add .
          git commit -m "chore: release packages"

      - name: Publish packages
        if: steps.release_mode.outputs.should_publish == 'true'
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ''
          NPM_CONFIG_PROVENANCE: true

      - name: Push release commit and tags atomically
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          mapfile -t RELEASE_TAGS < <(git tag --points-at HEAD)
          git push --atomic origin HEAD:main "${RELEASE_TAGS[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub releases
        if: steps.release_mode.outputs.should_publish == 'true'
        run: |
          for TAG in $(git tag --points-at HEAD); do
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Creating release for $TAG"
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
